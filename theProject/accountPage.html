<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account (orders/logout) page</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>


<body>
  <main>
    <header class="header">
      <!-- Logo on the left -->
      <a href="landingPage.html" class="logo">TeaStore</a>

      <!-- Right side: links + icons -->
      <div class="header-right" id="myLinks">

        <!-- Navigation links -->
        <div class="nav-menu">
          <a href="landingPage.html">Home</a>
          <a href="storyPage.html">Our Story</a>
          <a href="storePage.html">The Store</a>
          <a href="blogPage.html">Blog</a>
          <a href="contactPage.html">Contact</a>
        </div>

        <!-- Icons -->
        <div class="nav-icons">
          <a href="accountPage.html" class="nav-icon" aria-label="Account">
            <img src="/Icons/account.svg" alt="" class="nav-icon-image" aria-hidden="true">
          </a>
          <a href="cartPage.html" class="nav-icon" aria-label="Cart">
            <img src="/Icons/cart.svg" alt="" class="nav-icon-image" aria-hidden="true">
          </a>
        </div>

        <div class="off-screen-menu">
          <ul>
            <li class="mobile-links">Home</li>
            <li class="mobile-links">Our Story</li>
            <li class="mobile-links">Store</li>
            <li class="mobile-links">Blog</li>
            <li class="mobile-links">Contact</li>
          </ul>
        </div>

        <nav class="ham-nav">
          <div class="ham-menu">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </nav>

      </div>
    </header>

    <main>
      <!-- Hero section -->
      <section class="account-hero">
        <div class="account-hero-background-image" data-parallax data-speed="0.05">
          <img src="/Images/paintingRoom.jpg" alt="Japanese painting room image" />
        </div>
        <div class="account-hero-content">
          <h1 class="story-hero-title">This is your account</h1>
        </div>

        <div class="orders-btn">
          <a href="#" class="store-button">
            <span>Orders</span>
          </a>
        </div>
        <div class="logout-btn">
          <a href="?" class="store-button">
            <span>Log out</span>
          </a>
        </div>
    </main>

    <!-- Footer section -->
    <footer class="site-footer">
      <div class="container footer-nav">
        <a href="landingPage.html">Homepage</a>
        <a href="storyPage.html">Our Story</a>
        <a href="storePage.html">The Store</a>
        <a href="contactPage.html">Contact</a>
      </div>

      <div class="container footer-social">
        <a href="#" aria-label="Instagram">
          <img src="/Icons/instagram.svg" alt="" class="footer-icon">
        </a>

        <a href="#" aria-label="Facebook">
          <img src="/Icons/facebook.svg" alt="" class="footer-icon">
        </a>
      </div>
    </footer>

    <script type="module" src="accountPage.js"></script>

</body>

</html>
